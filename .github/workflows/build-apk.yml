name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AutoSlash.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AutoSlash-apk
          path: AutoSlash.apk

      - name: Publish to the "latest-apk" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: AutoSlash (latest build)
          prerelease: true
          files: AutoSlash.apk
          body: |
            Debug APK built from `${{ github.ref_name }}` @ `${{ github.sha }}`.
            Download AutoSlash.apk on your phone and open it to install.
